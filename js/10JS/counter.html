<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class = "box">
       <button class ="inc">inc</button>
        <h3>0</h3>
        <button class ="dec">dec</button>
    </div>
    <script>
        const inc = document.querySelector('.inc');
        // console.log(inc);
        const cnt = document.querySelector('h3');
        // console.log(cnt);
        const dec = document.querySelector('.dec');
        // console.log(dec)

        inc.addEventListener('click', () =>{
            cnt.innerHTML = Number(cnt.innerHTML)+1
            console.log(cnt.innerHTML)
        })
        dec.addEventListener('click', () =>{
            if (Number(cnt.innerHTML)>0){
            cnt.innerHTML = Number(cnt.innerHTML)-1
            }
            console.log(cnt.innerHTML)
        })

    </script>
</body>
</html>
